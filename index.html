<!DOCTYPE html>

<html lang="en">



<head>
    <meta charset="UTF-8">


    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>File management tool</title>


    <link rel="stylesheet" href="assets/themeStyles.css">
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>


</head>








<body>

    <div class="main-card" card data-tooltip="">

        <row data-tooltip="Select a folder to organize by the above dropdown">
            <b>File management tool</b>
            <i class="ph ph-info" style="padding-top: 3px;"></i>
        </row>

        <a href="https://mcv-s.github.io/" style="text-decoration: none; color: var(--text);">By @mcv-s</a>
        <br>

        <select disabled data-tooltip="More options coming?">
            <option >Sort folder by file type</option>
        </select>
        <div spacer></div>

        <button class="startButton" data-tooltip="Press to open directory picker"><i class="ph ph-file"></i> Organize Folder</button>

        <div class="bar-holder">
            <div class="bar"></div>
        </div>
        
        <i><div hidden class="statusText" style="padding-top: 5px;">Moved file absads.html</div></i>


    </div>




</body>

<script src="program.js"></script>
<script src="assets/themeToggle.js"></script>
