<!DOCTYPE html>

<html lang="en">



<head>
    <meta charset="UTF-8">


    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>File management tool</title>
    <link rel="icon" href="Icon_1.svg">



    <link rel="stylesheet" href="assets/themeStyles.css">
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

<body>

    <column style="gap: 0px;">
        <!--

            <div class="tab1" active>Sorter</div>

        </row>

        -->

        <div class="main-card" card data-tooltip="">

            <row data-tooltip="Select a folder to organize">

            </row>

            </div>
